# Secret do banco: usuario, senha e nome do banco do lances-service.
# Lido pelo Postgres (banco/deployment.yaml) e pelo servico (app/deployment.yaml).
# Valores de desenvolvimento local (os mesmos do docker-compose).
apiVersion: v1
kind: Secret
metadata:
  name: lances-db-secret
  labels:
    app: lances-db
type: Opaque
stringData:
  POSTGRES_USER: "lances_user"
  POSTGRES_PASSWORD: "lances_pass"
  POSTGRES_DB: "lances_db"
