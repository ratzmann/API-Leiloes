# HorizontalPodAutoscaler: escalabilidade automatica.
# Nunca menos de 2 pods; se a CPU media passar de 70% do "request", cria mais
# pods (ate 5). Precisa do addon metrics-server: minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usuarios-service
  labels:
    app: usuarios-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usuarios-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
