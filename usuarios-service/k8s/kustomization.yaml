# =============================================================================
# kustomization.yaml  -  "INDICE" dos manifests do usuarios-service (T3)
# -----------------------------------------------------------------------------
# Lista tudo o que vai para o cluster. Um unico comando aplica a pasta inteira:
#   kubectl apply -k usuarios-service/k8s
#
#   namespace.yaml        -> namespace "usuarios" (isola os recursos do servico)
#   app/                  -> o microsservico: ConfigMap, Secret, Deployment (2 replicas),
#                            Service, Ingress e HPA (escala de 2 ate 5 pods pela CPU)
#   banco/                -> o Postgres proprio do servico (1 replica + volume persistente)
#   observabilidade/      -> Prometheus e Grafana rodando DENTRO do cluster
#
# Os arquivos de configuracao do Prometheus e do Grafana (prometheus.yml e o
# dashboard JSON) viram ConfigMaps pelo configMapGenerator abaixo.
# Mesma estrutura do leiloes-service/k8s (padrao da equipe no T3).
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: usuarios

resources:
  - namespace.yaml
  # banco de dados do servico
  - banco/secret.yaml
  - banco/pvc.yaml
  - banco/deployment.yaml
  - banco/service.yaml
  # o microsservico
  - app/configmap.yaml
  - app/secret.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/ingress.yaml
  - app/hpa.yaml
  # observabilidade (dentro do cluster)
  - observabilidade/prometheus.yaml
  - observabilidade/grafana.yaml
  - observabilidade/ingress.yaml

# Imagem do servico: a MESMA que o pipeline (CI/CD do T2) publica no GHCR.
# A tag e a versao (Semantic Versioning) publicada na main; ao subir a versao no
# package.json, suba aqui tambem.
images:
  - name: usuarios-service
    newName: ghcr.io/ratzmann/usuarios-service
    newTag: 1.1.3

# Arquivos de configuracao viram ConfigMaps (montados como arquivos nos pods).
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - observabilidade/prometheus/prometheus.yml
  - name: grafana-provisionamento
    files:
      - observabilidade/grafana/datasource.yml
      - observabilidade/grafana/dashboards.yml
  - name: grafana-dashboards
    files:
      - observabilidade/grafana/usuarios-service-k8s.json
