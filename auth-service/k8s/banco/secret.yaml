# Secret do banco: usuario, senha e nome do banco do auth-service.
# Lido pelo Postgres (banco/deployment.yaml) e pelo servico (app/deployment.yaml).
# Valores de desenvolvimento local (os mesmos do docker-compose).
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  labels:
    app: auth-db
type: Opaque
stringData:
  POSTGRES_USER: "auth_user"
  POSTGRES_PASSWORD: "auth_pass"
  POSTGRES_DB: "auth_db"
