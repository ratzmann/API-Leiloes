# Secret do banco: usuario, senha e nome do banco do usuarios-service.
# Lido pelo Postgres (banco/deployment.yaml) e pelo servico (app/deployment.yaml).
# Valores de desenvolvimento local (os mesmos do docker-compose).
apiVersion: v1
kind: Secret
metadata:
  name: usuarios-db-secret
  labels:
    app: usuarios-db
type: Opaque
stringData:
  POSTGRES_USER: "usuarios_user"
  POSTGRES_PASSWORD: "usuarios_pass"
  POSTGRES_DB: "usuarios_db"
