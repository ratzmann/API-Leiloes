# ConfigMap: variaveis de ambiente NAO sensiveis do auth-service.
# O Deployment injeta todas como variaveis de ambiente (envFrom). O codigo le
# tudo de process.env (src/config/, utils/jwt.js e clients/), sem nenhum valor
# fixo: a mesma imagem que roda no Render roda aqui, so muda esta configuracao.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  labels:
    app: auth-service
data:
  PORT: "3001"
  # nome do ambiente: aparece no /health e no rotulo "ambiente" das metricas
  APP_ENV: "k8s"
  # Swagger ligado no cluster local (em /docs), como no DEV
  SWAGGER_ENABLED: "true"
  # banco: o Service "auth-db" (DNS interno do cluster)
  DB_HOST: "auth-db"
  DB_PORT: "5432"
  DB_SSL: "false"
  # emissor e validade do token (usuarios, leiloes e lances conferem o emissor)
  JWT_ISSUER: "sistema-leilao-auth"
  JWT_EXPIRES_IN: "2h"
  # o registro cria o perfil no usuarios-service, que roda em OUTRO namespace
  # ("usuarios"): o DNS completo do Service e <servico>.<namespace>.svc.cluster.local.
  # Vazio = auth rodando sozinho (so cria a credencial, perfil null), como no T2.
  USUARIOS_SERVICE_URL: "http://usuarios-service.usuarios.svc.cluster.local:3002"
  SERVICOS_TIMEOUT_MS: "3000"
