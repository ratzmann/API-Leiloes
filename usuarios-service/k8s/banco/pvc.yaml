# PersistentVolumeClaim: um "disco" de 1 GiB para os dados do Postgres.
# Os dados sobrevivem quando o pod do banco e recriado.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usuarios-db-dados
  labels:
    app: usuarios-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
