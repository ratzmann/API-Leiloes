# Secret: dados SENSIVEIS do lances-service (injetados como variaveis de ambiente).
# stringData aceita o texto puro; o Kubernetes guarda em base64.
# Valores de DESENVOLVIMENTO LOCAL (os mesmos do .env.example). Num cluster real
# este arquivo nao iria para o Git: seria criado com
#   kubectl create secret generic lances-service-secret --from-literal=...
# A senha do banco fica no Secret do Postgres (banco/secret.yaml) e e lida de la.
apiVersion: v1
kind: Secret
metadata:
  name: lances-service-secret
  labels:
    app: lances-service
type: Opaque
stringData:
  # mesmo segredo do auth-service: o servico confere a assinatura do token
  JWT_SECRET: "super-segredo-trabalho-microsservicos"
  # chave das rotas internas do usuarios-service (header X-Chave-Interna)
  CHAVE_INTERNA: "chave-interna-trabalho-microsservicos"
