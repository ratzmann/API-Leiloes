# Analise do SonarCloud (organizacao e chave vem das variaveis do repositorio,
# passadas pelo workflow .github/workflows/usuarios-service.yml)
sonar.projectName=usuarios-service
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/**/__mocks__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# mesmo escopo de cobertura do Jest (package.json > jest.collectCoverageFrom)
sonar.coverage.exclusions=src/server.js,src/controllers/**,src/repositories/**,src/routes/**,src/middlewares/**
sonar.sourceEncoding=UTF-8
