# Secret: dados SENSIVEIS do auth-service (injetados como variaveis de ambiente).
# stringData aceita o texto puro; o Kubernetes guarda em base64.
# Valores de DESENVOLVIMENTO LOCAL (os mesmos do docker-compose). Num cluster real
# este arquivo nao iria para o Git: seria criado com
#   kubectl create secret generic auth-service-secret --from-literal=...
# A senha do banco fica no Secret do Postgres (banco/secret.yaml) e e lida de la.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  labels:
    app: auth-service
type: Opaque
stringData:
  # segredo que ASSINA os tokens: usuarios, leiloes e lances conferem com o mesmo
  JWT_SECRET: "super-segredo-trabalho-microsservicos"
  # chave das rotas internas do usuarios-service (header X-Chave-Interna),
  # mandada ao criar o perfil no registro. IGUAL nos 4 servicos.
  CHAVE_INTERNA: "chave-interna-trabalho-microsservicos"
