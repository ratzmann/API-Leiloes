# Secret: dados SENSIVEIS do usuarios-service (injetados como variaveis de ambiente).
# stringData aceita o texto puro; o Kubernetes guarda em base64.
# Valores de DESENVOLVIMENTO LOCAL (os mesmos do docker-compose). Num cluster real
# este arquivo nao iria para o Git: seria criado com
#   kubectl create secret generic usuarios-service-secret --from-literal=...
# A senha do banco fica no Secret do Postgres (banco/secret.yaml) e e lida de la.
apiVersion: v1
kind: Secret
metadata:
  name: usuarios-service-secret
  labels:
    app: usuarios-service
type: Opaque
stringData:
  # mesmo segredo do auth-service: o servico confere a assinatura do token
  JWT_SECRET: "super-segredo-trabalho-microsservicos"
  # chave exigida nas rotas internas (criar perfil, reservar e liberar credito):
  # os outros servicos a mandam no header X-Chave-Interna. IGUAL nos 4 servicos.
  CHAVE_INTERNA: "chave-interna-trabalho-microsservicos"
