# Secret do banco: usuario, senha e nome do banco do leiloes-service.
# Lido pelo Postgres (banco/deployment.yaml) e pelo servico (app/deployment.yaml).
# Valores de desenvolvimento local (os mesmos do docker-compose).
apiVersion: v1
kind: Secret
metadata:
  name: leiloes-db-secret
  labels:
    app: leiloes-db
type: Opaque
stringData:
  POSTGRES_USER: "leiloes_user"
  POSTGRES_PASSWORD: "leiloes_pass"
  POSTGRES_DB: "leiloes_db"
