# Service do banco: o usuarios-service conecta em "usuarios-db:5432"
# (DB_HOST no app/configmap.yaml). Sem Ingress: o banco nao sai do cluster.
apiVersion: v1
kind: Service
metadata:
  name: usuarios-db
  labels:
    app: usuarios-db
spec:
  type: ClusterIP
  selector:
    app: usuarios-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
