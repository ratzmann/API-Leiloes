# O Prometheus busca GET /metrics de cada alvo a cada 15 s ("scrape").
# Cada metrica do servico ja traz os rotulos ambiente e versao; o rotulo "alvo"
# abaixo identifica de onde o Prometheus leu (usado no painel "Servico no ar").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # copia local (docker-compose desta pasta)
  - job_name: leiloes-service-local
    static_configs:
      - targets: ['leiloes-service:3003']
        labels:
          alvo: local

  # Render - DEV (branch develop). O servico foi recriado em 20/10 e o Render
  # acrescentou o sufixo -bnhz ao nome: o endereco real e este.
  - job_name: leiloes-service-dev
    scheme: https
    static_configs:
      - targets: ['leiloes-service-dev-bnhz.onrender.com']
        labels:
          alvo: dev

  # Render - HOMOL (branch main), tambem com sufixo (-igr9) dado pelo Render
  - job_name: leiloes-service-homol
    scheme: https
    static_configs:
      - targets: ['leiloes-service-homol-igr9.onrender.com']
        labels:
          alvo: homol
