# Service do banco: o lances-service conecta em "lances-db:5432"
# (DB_HOST no app/configmap.yaml). Sem Ingress: o banco nao sai do cluster.
apiVersion: v1
kind: Service
metadata:
  name: lances-db
  labels:
    app: lances-db
spec:
  type: ClusterIP
  selector:
    app: lances-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
