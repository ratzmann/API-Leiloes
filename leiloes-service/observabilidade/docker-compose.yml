# Observabilidade do leiloes-service: Prometheus (coleta) + Grafana (dashboards).
#   cd leiloes-service/observabilidade && docker compose up -d --build
#   Grafana:    http://localhost:3000  (admin / admin; dashboard "leiloes-service")
#   Prometheus: http://localhost:9090  (Status > Targets mostra local, DEV e HOMOL)
#   Servico:    http://localhost:3003  (Swagger em /docs, metricas em /metrics)
#
# Sobe tambem uma copia LOCAL do servico + banco, para a demo funcionar sem internet.
# Os alvos DEV e HOMOL (Render) ficam em prometheus/prometheus.yml.
name: leiloes-observabilidade

services:
  leiloes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leiloes_user
      POSTGRES_PASSWORD: leiloes_pass
      POSTGRES_DB: leiloes_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leiloes_user -d leiloes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  leiloes-service:
    build: ..
    environment:
      PORT: 3003
      APP_ENV: local
      DB_HOST: leiloes-db
      DB_PORT: 5432
      DB_USER: leiloes_user
      DB_PASSWORD: leiloes_pass
      DB_NAME: leiloes_db
      # o servico confere a assinatura do token (jwt.verify); sem o segredo, toda
      # chamada com token vira 500. Mesmo segredo e emissor que o gerar-trafego.ps1 usa.
      JWT_SECRET: ${JWT_SECRET:-super-segredo-trabalho-microsservicos}
      JWT_ISSUER: sistema-leilao-auth
      # sem USUARIOS_SERVICE_URL: roda sozinho, sem validar o leiloeiro
    ports:
      - "3003:3003"
    depends_on:
      leiloes-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - leiloes-service

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # quem so quer olhar entra sem login (somente leitura)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leiloes-service.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
