# Pipeline do auth-service (T2 - CI/CD). Um pipeline por microsservico:
# so roda quando algo dentro de auth-service/ (ou este arquivo) muda.
# Environments com prefixo (auth-dev / auth-homol): dev e homol sao do leiloes-service,
# e o secret RENDER_DEPLOY_HOOK_URL tem o mesmo nome em todos.
#
#   feature/*  -> ci (build + testes + SonarCloud) -> k8s + build da imagem (sem publicar)
#   develop    -> ci -> versao -> k8s -> imagem (GHCR) -> deploy DEV   (Render, Swagger ligado)
#   main       -> ci -> versao -> k8s -> imagem (GHCR) -> deploy HOMOL (Render, Swagger desligado)
#
# T3: o job k8s sobe um Minikube no runner, aplica usuarios-service/k8s/ e
# auth-service/k8s/ com as imagens recem-construidas e confere 2+ pods no ar, o
# registro (auth -> usuarios entre namespaces) pelo Ingress e o Prometheus coletando
# de cada pod. So depois a imagem e publicada.
name: auth-service

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'
  workflow_dispatch:

# um push novo no mesmo branch cancela so a execucao de PR antiga; deploys nunca sao cortados
concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# menor privilegio: cada job pede so o que precisa
permissions:
  contents: read

env:
  SERVICO: auth-service

defaults:
  run:
    working-directory: auth-service

jobs:
  ci:
    name: Build, testes e SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o Sonar usa o historico para saber o que e codigo novo

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Instalar dependencias (build)
        run: npm ci

      # barra vulnerabilidade CRITICA conhecida nas dependencias que vao para a imagem
      - name: Auditoria de seguranca das dependencias
        run: npm audit --omit=dev --audit-level=critical

      - name: Testes automatizados com cobertura (minimo 50%)
        run: npm test -- --ci

      - name: Guardar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-auth-service
          path: auth-service/coverage/
          retention-days: 7

      - name: Verificar configuracao do SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY_AUTH }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::warning::SonarCloud nao configurado (secret SONAR_TOKEN e variaveis SONAR_ORGANIZATION/SONAR_PROJECT_KEY_AUTH); analise pulada."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analise SonarCloud
        if: steps.sonar.outputs.ativo == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: auth-service
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_AUTH }}

  versao:
    name: Versao (Semantic Versioning)
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.calc.outputs.versao }}
      versao_imagem: ${{ steps.calc.outputs.versao_imagem }}
      imagem: ${{ steps.calc.outputs.imagem }}
      tags: ${{ steps.calc.outputs.tags }}
      ambiente: ${{ steps.calc.outputs.ambiente }}
      publicar: ${{ steps.calc.outputs.publicar }}
      tag_git: ${{ steps.calc.outputs.tag_git }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # precisa das tags git para conferir se a versao ja foi publicada

      - name: Calcular versao e tags da imagem
        id: calc
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if ! echo "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versao '$VERSAO' do package.json nao segue MAJOR.MINOR.PATCH."
            exit 1
          fi

          DONO=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGEM="ghcr.io/$DONO/$SERVICO"
          TAG_GIT="$SERVICO-v$VERSAO"
          SHA_CURTO=${GITHUB_SHA::7}
          AMBIENTE=""
          EXTRAS=""

          case "$GITHUB_REF" in
            refs/heads/main)
              # cada versao publicada em HOMOL e imutavel: se a tag ja existe em outro commit, falha
              if git rev-parse -q --verify "refs/tags/$TAG_GIT" > /dev/null; then
                COMMIT_DA_TAG=$(git rev-list -n 1 "$TAG_GIT")
                if [ "$COMMIT_DA_TAG" != "$GITHUB_SHA" ]; then
                  echo "::error::A versao $VERSAO ja foi publicada (tag $TAG_GIT). Suba a versao no auth-service/package.json (MAJOR.MINOR.PATCH)."
                  exit 1
                fi
              fi
              VERSAO_IMAGEM="$VERSAO"; EXTRAS="homol latest"; AMBIENTE="homol" ;;
            refs/heads/develop)
              VERSAO_IMAGEM="$VERSAO-dev.$GITHUB_RUN_NUMBER"; EXTRAS="dev"; AMBIENTE="dev" ;;
            *)
              VERSAO_IMAGEM="$VERSAO-build.$GITHUB_RUN_NUMBER" ;;
          esac

          PUBLICAR=false
          if [ -n "$AMBIENTE" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then PUBLICAR=true; fi

          {
            echo "versao=$VERSAO"
            echo "versao_imagem=$VERSAO_IMAGEM"
            echo "imagem=$IMAGEM"
            echo "ambiente=$AMBIENTE"
            echo "publicar=$PUBLICAR"
            echo "tag_git=$TAG_GIT"
            echo "tags<<FIM"
            echo "$IMAGEM:$VERSAO_IMAGEM"
            for extra in $EXTRAS; do echo "$IMAGEM:$extra"; done
            echo "$IMAGEM:sha-$SHA_CURTO"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Versao do auth-service"
            echo "- versao (package.json): \`$VERSAO\`"
            echo "- versao da imagem: \`$VERSAO_IMAGEM\`"
            echo "- ambiente de destino: \`${AMBIENTE:-nenhum (so build)}\`"
            echo "- publica a imagem: \`$PUBLICAR\`"
          } >> "$GITHUB_STEP_SUMMARY"

  k8s:
    name: Kubernetes (Minikube) - deploy de teste
    needs: [ci, versao]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar os manifests (kustomize)
        run: |
          kubectl kustomize k8s > /dev/null
          kubectl kustomize ../usuarios-service/k8s > /dev/null

      - name: Subir o Minikube (ingress + metrics-server)
        run: |
          if ! command -v minikube > /dev/null; then
            curl -sSLo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo install minikube /usr/local/bin/minikube
          fi
          minikube start --driver=docker --wait=all
          minikube addons enable ingress
          minikube addons enable metrics-server

      # build no Docker do runner e carga no Minikube (o runtime do Minikube e o containerd).
      # O usuarios-service tambem sobe: o registro do auth cria o perfil nele.
      - name: Construir as imagens (auth e usuarios) e carregar no Minikube
        env:
          VERSAO_IMAGEM: ${{ needs.versao.outputs.versao_imagem }}
        run: |
          docker build --build-arg "VERSAO_IMAGEM=$VERSAO_IMAGEM" -t auth-service:ci .
          docker build -t usuarios-service:ci ../usuarios-service
          minikube image load auth-service:ci
          minikube image load usuarios-service:ci

      # overlays temporarios: os mesmos manifests de k8s/, trocando so a imagem pela do teste
      - name: Aplicar os manifests (usuarios e auth)
        run: |
          mkdir -p k8s-ci/usuarios k8s-ci/auth
          cat > k8s-ci/usuarios/kustomization.yaml <<'FIM'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../../usuarios-service/k8s
          images:
            - name: ghcr.io/ratzmann/usuarios-service
              newName: usuarios-service
              newTag: ci
          FIM
          cat > k8s-ci/auth/kustomization.yaml <<'FIM'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../k8s
          images:
            - name: ghcr.io/ratzmann/auth-service
              newName: auth-service
              newTag: ci
          FIM
          kubectl apply -k k8s-ci/usuarios
          kubectl apply -k k8s-ci/auth
          for d in usuarios-db usuarios-service; do
            kubectl -n usuarios rollout status "deployment/$d" --timeout=240s
          done
          for d in auth-db auth-service prometheus grafana; do
            kubectl -n auth rollout status "deployment/$d" --timeout=240s
          done
          kubectl get pods -A -o wide

      - name: Conferir replicas, registro auth -> usuarios e Prometheus
        env:
          VERSAO_ESPERADA: ${{ needs.versao.outputs.versao_imagem }}
        run: bash ci/testar-k8s.sh "$(minikube ip)"

      - name: Diagnostico (so em falha)
        if: failure()
        run: |
          kubectl get all,ingress,hpa -A || true
          kubectl -n auth describe pods || true
          kubectl -n auth logs -l app=auth-service --tail=100 --prefix || true
          kubectl -n usuarios logs -l app=usuarios-service --tail=100 --prefix || true

  imagem:
    name: Imagem Docker (build e publicacao no GHCR)
    needs: [ci, versao, k8s]
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag git da versao (main)
      packages: write # publicar no GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        if: needs.versao.outputs.publicar == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push em develop/main)
        uses: docker/build-push-action@v7
        with:
          context: auth-service
          push: ${{ needs.versao.outputs.publicar == 'true' }}
          tags: ${{ needs.versao.outputs.tags }}
          build-args: |
            VERSAO_IMAGEM=${{ needs.versao.outputs.versao_imagem }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=auth-service
            org.opencontainers.image.version=${{ needs.versao.outputs.versao_imagem }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service

      - name: Criar tag git da versao (HOMOL)
        if: needs.versao.outputs.ambiente == 'homol' && needs.versao.outputs.publicar == 'true'
        env:
          TAG_GIT: ${{ needs.versao.outputs.tag_git }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_GIT" > /dev/null; then
            echo "Tag $TAG_GIT ja existe neste commit."
          else
            git tag "$TAG_GIT" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG_GIT"
          fi

  deploy-dev:
    name: Deploy DEV (Render)
    needs: [versao, imagem]
    if: needs.versao.outputs.ambiente == 'dev' && needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: auth-dev
      url: ${{ vars.RENDER_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy da imagem e smoke test
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_URL: ${{ vars.RENDER_URL }}
          IMAGEM: ${{ needs.versao.outputs.imagem }}:${{ needs.versao.outputs.versao_imagem }}
          VERSAO_ESPERADA: ${{ needs.versao.outputs.versao_imagem }}
        run: bash ci/deploy-render.sh

  deploy-homol:
    name: Deploy HOMOL (Render)
    needs: [versao, imagem]
    if: needs.versao.outputs.ambiente == 'homol' && needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: auth-homol
      url: ${{ vars.RENDER_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy da imagem e smoke test
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_URL: ${{ vars.RENDER_URL }}
          IMAGEM: ${{ needs.versao.outputs.imagem }}:${{ needs.versao.outputs.versao_imagem }}
          VERSAO_ESPERADA: ${{ needs.versao.outputs.versao_imagem }}
        run: bash ci/deploy-render.sh
