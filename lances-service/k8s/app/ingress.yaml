# Ingress: porta de entrada HTTP de fora do cluster (addon "ingress" do Minikube,
# NGINX). Quem acessa http://lances.localhost e levado ao Service lances-service.
# Nomes terminados em .localhost apontam sozinhos para 127.0.0.1 (sem editar o
# arquivo hosts). No Windows, basta deixar "minikube tunnel" rodando.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lances-service
  labels:
    app: lances-service
spec:
  ingressClassName: nginx
  rules:
    - host: lances.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lances-service
                port:
                  name: http
