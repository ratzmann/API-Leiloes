# Analise do SonarCloud (organizacao e chave vem das variaveis do repositorio,
# passadas pelo workflow .github/workflows/lances-service.yml)
sonar.projectName=lances-service
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/**/__mocks__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# no Sonar a cobertura conta so a logica (services, sagas, clients, utils, config...);
# o Jest mede todo o src/ e exige no minimo 50% (package.json > jest)
sonar.coverage.exclusions=src/server.js,src/controllers/**,src/repositories/**,src/routes/**,src/middlewares/**
sonar.sourceEncoding=UTF-8
